; DEMO ONLY — vulnerable precondition for php2shell is upload_progress=On
expose_php = Off
display_errors = stderr
log_errors = 1
error_log = /dev/stderr
date.timezone = UTC
post_max_size = 32M
upload_max_filesize = 32M
opcache.enable = 1
opcache.enable_cli = 1
opcache.jit_buffer_size = 100M
opcache.jit = tracing
session.gc_divisor = 100
session.gc_probability = 15
; the knob the upstream fix set to 0 — left ON on purpose for the demo
session.upload_progress.enabled = 1
